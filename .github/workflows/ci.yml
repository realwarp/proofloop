name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node --check scripts/nebius-preflight.mjs
      - run: node --check scripts/verify-migration-fixture.mjs
      - run: python -m py_compile scripts/sandbox-smoke.py
      - run: npm run verify:fixture
